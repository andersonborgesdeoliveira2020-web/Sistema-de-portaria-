<script>
    const form = document.getElementById('formPortaria');
    
    // Função para salvar no LocalStorage
    form.addEventListener('submit', function(event) {
        event.preventDefault();
        
        // Captura os dados do formulário
        const novoRegistro = {
            tipo: document.getElementById('tipo').value,
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value,
            empresa: document.getElementById('empresa').value,
            visitado: document.getElementById('visitado').value,
            numero_nf: document.getElementById('numero_nf').value,
            entregador: document.getElementById('entregador').value,
            empresa_entrega: document.getElementById('empresa_entrega').value,
            placa_carro: document.getElementById('placa_carro').value,
            data: new Date().toLocaleString() // Adiciona data e hora do registro
        };

        // Pega os registros existentes ou cria um array vazio
        let registros = JSON.parse(localStorage.getItem('registrosVicon') || '[]');
        
        // Adiciona o novo registro
        registros.push(novoRegistro);
        
        // Salva de volta no LocalStorage
        localStorage.setItem('registrosVicon', JSON.stringify(registros));
        
        alert('Registro salvo com sucesso!');
        form.reset();
    });

    // Função de busca
    const btnBuscar = document.getElementById('btnBuscar');
    btnBuscar.addEventListener('click', function() {
        const termoBusca = document.getElementById('busca').value.toLowerCase();
        const registros = JSON.parse(localStorage.getItem('registrosVicon') || '[]');
        
        const resultado = registros.find(r => 
            r.nome.toLowerCase().includes(termoBusca) || 
            r.cpf.includes(termoBusca)
        );

        if (resultado) {
            alert('Registro encontrado:\nNome: ' + resultado.nome + '\nData: ' + resultado.data + '\nVisitado: ' + resultado.visitado);
        } else {
            alert('Nenhum registro encontrado com esse nome ou CPF.');
        }
    });
</script>
