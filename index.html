<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Vicon Logística 2026</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .container { background: #fff; padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; margin-bottom: 20px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #fff; margin-bottom: 10px; font-size: 16px; }
        #camera-zone, #video { width: 100%; height: 250px; background: #000; display: none; margin-bottom: 10px; border-radius: 8px; }
        textarea { width: 100%; height: 80px; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; justify-content:center; align-items:center; }
        .modal-content { background:#fff; padding:20px; border-radius:10px; width:90%; max-width:400px; text-align:center; }
        canvas { border: 2px solid #333; width: 100%; height: 200px; background: #fff; touch-action: none; cursor: crosshair; }
        .relatorio-box { font-size: 14px; text-align: left; margin-top: 10px; }
        .status-msg { color: #3498db; font-weight: bold; display: none; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h3>📦 Recebimento Inteligente</h3>
    <div id="camera-zone"></div>
    <video id="video" autoplay playsinline></video>
    <div id="statusOCR" class="status-msg">Processando leitura...</div>
    <button class="btn" style="background:#3498db" onclick="iniciarLeitura()">📷 Ler QR / Barras</button>
    <button class="btn" style="background:#27ae60" onclick="iniciarOCR()">📄 OCR (Texto)</button>
    <textarea id="resultado" placeholder="Dados da etiqueta..."></textarea>
    <button class="btn" style="background:#2c3e50" onclick="salvarEncomenda()">💾 Salvar no Estoque</button>
</div>

<div class="container">
    <h3>📤 Dar Saída / Baixa</h3>
    <button class="btn" style="background:#e67e22" onclick="iniciarLeituraSaida()">📷 Escanear para Baixa</button>
</div>

<div class="container">
    <h3>📊 Relatórios de Gestão</h3>
    <input type="date" id="dataInicio" onchange="gerarRelatorio()">
    <input type="date" id="dataFim" onchange="gerarRelatorio()">
    <div class="relatorio-box">
        <p>Entregues: <strong id="totalEntregue">0</strong> | Pendentes: <strong id="totalPendente">0</strong></p>
        <div id="listaRelatorio"></div>
    </div>
</div>

<div id="modalAssinatura" class="modal">
    <div class="modal-content">
        <h4>Assinatura de Retirada</h4>
        <canvas id="canvasSig"></canvas>
        <button class="btn" style="background:#27ae60; margin-top:10px;" onclick="confirmarBaixa()">Confirmar Entrega</button>
        <button class="btn" style="background:#7f8c8d" onclick="fecharModal()">Cancelar</button>
    </div>
</div>

<script>
    const cameraZone = document.getElementById('camera-zone'), video = document.getElementById('video'), resultado = document.getElementById('resultado');
    const canvasSig = document.getElementById('canvasSig'), ctxSig = canvasSig.getContext('2d'), statusOCR = document.getElementById('statusOCR');
    let indiceEncontrado = null, desenhando = false;

    // --- ASSINATURA ---
    function desenhar(e) {
        if (!desenhando) return;
        e.preventDefault();
        const rect = canvasSig.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        ctxSig.lineWidth = 3; ctxSig.lineCap = 'round';
        ctxSig.lineTo(clientX - rect.left, clientY - rect.top);
        ctxSig.stroke();
    }
    canvasSig.onmousedown = () => { desenhando = true; ctxSig.beginPath(); };
    canvasSig.onmouseup = () => desenhando = false;
    canvasSig.onmousemove = desenhar;
    canvasSig.ontouchstart = () => { desenhando = true; ctxSig.beginPath(); };
    canvasSig.ontouchend = () => desenhando = false;
    canvasSig.ontouchmove = desenhar;

    // --- OPERAÇÕES ---
    function iniciarLeitura() {
        cameraZone.style.display = 'block';
        const scanner = new Html5Qrcode("camera-zone");
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (t) => { scanner.stop(); cameraZone.style.display = 'none'; resultado.value = t; });
    }

    async function iniciarOCR() {
        video.style.display = 'block';
        statusOCR.style.display = 'block';
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            setTimeout(async () => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const { data: { text } } = await Tesseract.recognize(canvas, 'por');
                resultado.value = text.trim();
                video.style.display = 'none';
                statusOCR.style.display = 'none';
                stream.getTracks().forEach(t => t.stop());
            }, 2500);
        } catch (err) { alert("Erro ao acessar câmera: " + err); statusOCR.style.display = 'none'; }
    }

    function salvarEncomenda() {
        if(!resultado.value) return alert("Nada para salvar!");
        let lista = JSON.parse(localStorage.getItem('encomendas_vicon') || '[]');
        lista.push({ codigo: resultado.value.trim(), status: 'Aguardando', data: new Date().toISOString().split('T')[0] });
        localStorage.setItem('encomendas_vicon', JSON.stringify(lista));
        alert("Salvo com sucesso!"); resultado.value = ""; gerarRelatorio();
    }

    function iniciarLeituraSaida() {
        cameraZone.style.display = 'block';
        const scanner = new Html5Qrcode("camera-zone");
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (t) => { scanner.stop(); cameraZone.style.display = 'none'; localizarEncomenda(t); });
    }

    function localizarEncomenda(codigo) {
        let lista = JSON.parse(localStorage.getItem('encomendas_vicon') || '[]');
        let index = lista.findIndex(e => e.codigo.trim() === codigo.trim() && e.status === 'Aguardando');
        if (index !== -1) { indiceEncontrado = index; document.getElementById('modalAssinatura').style.display = 'flex'; }
        else alert("Item não encontrado ou já entregue!");
    }

    function confirmarBaixa() {
        let lista = JSON.parse(localStorage.getItem('encomendas_vicon'));
        lista[indiceEncontrado].status = 'Entregue';
        lista[indiceEncontrado].assinatura = canvasSig.toDataURL();
        localStorage.setItem('encomendas_vicon', JSON.stringify(lista));
        alert("Baixa confirmada!"); fecharModal(); gerarRelatorio();
    }

    function gerarRelatorio() {
        let lista = JSON.parse(localStorage.getItem('encomendas_vicon') || '[]');
        let dI = document.getElementById('dataInicio').value, dF = document.getElementById('dataFim').value;
        let filtrados = lista.filter(item => {
            if(dI && dF) return item.data >= dI && item.data <= dF;
            return true;
        });
        document.getElementById('totalEntregue').innerText = filtrados.filter(i => i.status === 'Entregue').length;
        document.getElementById('totalPendente').innerText = filtrados.filter(i => i.status === 'Aguardando').length;
        document.getElementById('listaRelatorio').innerHTML = filtrados.map(i => `<div><b>${i.codigo}</b> (${i.data}): ${i.status}</div>`).join('');
    }

    function fecharModal() { document.getElementById('modalAssinatura').style.display = 'none'; ctxSig.clearRect(0,0,canvasSig.width,canvasSig.height); }
    window.onload = gerarRelatorio;
</script>
</body>
</html>
