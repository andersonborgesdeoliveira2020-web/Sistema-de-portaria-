<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Acesso - Portaria</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --danger-color: #e74c3c;
            --light-color: #ecf0f1;
            --dark-color: #34495e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-color);
            margin: 0;
            padding: 20px;
            color: var(--dark-color);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-save { background-color: var(--secondary-color); }
        .btn-save:hover { background-color: #128f76; }
        
        .btn-report { background-color: var(--primary-color); }
        .btn-report:hover { background-color: #1a252f; }

        .btn-output { 
            background-color: var(--danger-color); 
            padding: 5px 10px;
            font-size: 12px;
        }
        .btn-output:hover { background-color: #c0392b; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        tr:hover { background-color: #f5f5f5; }
        
        .status-active { color: #27ae60; font-weight: bold; }
        .status-closed { color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Controle de Portaria</h1>
    
    <div id="cadastro-form">
        <div class="form-group">
            <label for="tipo">Tipo de Acesso:</label>
            <select id="tipo">
                <option value="Visitante">Visitante</option>
                <option value="Prestador">Prestador de Serviço</option>
                <option value="Entrega">Entrega</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nome">Nome Completo / Empresa:</label>
            <input type="text" id="nome" placeholder="Ex: João Silva ou TransLog Entregas">
        </div>

        <div class="form-group">
            <label for="documento">Documento (RG/CPF/Placa):</label>
            <input type="text" id="documento" placeholder="Ex: 00.000.000-0 ou ABC-1234">
        </div>

        <div class="btn-container">
            <button class="btn-save" onclick="registrarEntrada()">Registrar Entrada</button>
            <button class="btn-report" onclick="gerarRelatorio()">Gerar Relatório</button>
        </div>
    </div>

    <h2>Movimentação Ativa</h2>
    <table>
        <thead>
            <tr>
                <th>Tipo</th>
                <th>Nome/Empresa</th>
                <th>Doc/Placa</th>
                <th>Entrada</th>
                <th>Saída</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-registros">
            </tbody>
    </table>
</div>

<script>
    // Inicializa a lista buscando do LocalStorage ou cria uma vazia
    let registros = JSON.parse(localStorage.getItem('controlePortaria')) || [];

    // Função para registrar uma nova entrada
    function registrarEntrada() {
        const tipo = document.getElementById('tipo').value;
        const nome = document.getElementById('nome').value.trim();
        const documento = document.getElementById('documento').value.trim();

        if (nome === '' || documento === '') {
            alert('Por favor, preencha todos os campos!');
            return;
        }

        const agora = new Date();
        const horaEntrada = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        const novoRegistro = {
            id: Date.now(),
            tipo: tipo,
            nome: nome,
            documento: documento,
            entrada: horaEntrada,
            saida: '-',
            status: 'Ativo'
        };

        registros.push(novoRegistro);
        salvarEAtualizar();
        
        // Limpa os campos após salvar
        document.getElementById('nome').value = '';
        document.getElementById('documento').value = '';
    }

    // Função para registrar a saída (Visitantes, Prestadores ou Entregas)
    function registrarSaida(id) {
        const agora = new Date();
        const horaSaida = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        registros.forEach(registro => {
            if (registro.id === id) {
                registro.saida = horaSaida;
                registro.status = 'Finalizado';
            }
        });

        salvarEAtualizar();
    }

    // Salva os dados no navegador e atualiza a tela
    function salvarEAtualizar() {
        localStorage.setItem('controlePortaria', JSON.stringify(registros));
        renderizarTabela();
    }

    // Desenha a tabela na tela
    function renderizarTabela() {
        const tabela = document.getElementById('tabela-registros');
        tabela.innerHTML = '';

        registros.forEach(registro => {
            const tr = document.createElement('tr');
            
            let acaoBotao = '';
            if (registro.status === 'Ativo') {
                acaoBotao = `<button class="btn-output" onclick="registrarSaida(${registro.id})">Dar Saída</button>`;
            } else {
                acaoBotao = `<span class="status-closed">Concluído</span>`;
            }

            tr.innerHTML = `
                <td>${registro.tipo}</td>
                <td>${registro.nome}</td>
                <td>${registro.documento}</td>
                <td>${registro.entrada}</td>
                <td>${registro.saida}</td>
                <td>${acaoBotao}</td>
            `;
            
            tabela.appendChild(tr);
        });
    }

    // Função para Gerar o Relatório
    function gerarRelatorio() {
        if (registros.length === 0) {
            alert('Não há registros para gerar relatório.');
            return;
        }

        let conteudoRelatorio = "=== RELATÓRIO DE PORTARIA ===\n\n";
        registros.forEach((r, index) => {
            conteudoRelatorio += `${index + 1}. [${r.tipo}] - Nome: ${r.nome} | Doc/Placa: ${r.documento} | Entrada: ${r.entrada} | Saída: ${r.saida} | Status: ${r.status}\n`;
        });

        // Cria um arquivo de texto para download rápido
        const blob = new Blob([conteudoRelatorio], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'relatorio_portaria.txt';
        link.click();
    }

    // Carrega a tabela assim que abre a página
    window.onload = renderizarTabela;
</script>

</body>
</html>
